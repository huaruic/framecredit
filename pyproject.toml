[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "framecredit"
version = "0.1.0"
description = "Burn your X handle into your videos before you publish, so reposted copies still credit you. Local-only video attribution."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "Ernest Chen"}]
keywords = [
  "video-attribution",
  "creator-tools",
  "x",
  "twitter",
  "ffmpeg",
  "video-processing",
  "content-credit",
  "repost",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://huaruic.com/framecredit/"
Repository = "https://github.com/huaruic/framecredit"
Issues = "https://github.com/huaruic/framecredit/issues"
Changelog = "https://github.com/huaruic/framecredit/blob/main/CHANGELOG.md"

[project.scripts]
framecredit = "framecredit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
framecredit = ["static/*.html"]
