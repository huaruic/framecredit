[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "framecredit"
version = "0.1.0"
description = "Burn durable creator attribution into videos before publishing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[project.scripts]
framecredit = "framecredit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
framecredit = ["static/*.html"]
